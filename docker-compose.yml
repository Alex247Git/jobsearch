# ================================================================
# jobsearch — Docker Compose stack
# ----------------------------------------------------------------
# Dev quickstart:   docker compose up --build
# Dev + Adminer:    docker compose --profile dev up --build
# Production:       docker compose -f docker-compose.yml \
#                     -f docker-compose.prod.yml up -d --build
#
# All credentials come from environment variables. Docker Compose
# auto-loads `.env` from this directory; without a `.env` the
# `:-default` fallbacks keep dev working out-of-the-box.
# ================================================================

services:
  api:
    build:
      context: .
      dockerfile: BackEnd/Dockerfile
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      DB_NAME: ${MYSQL_DATABASE:-jobsearch}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: ${PORT:-5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./FrontEnd
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: jobsearch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jobsearch}
      # Needed so the `api` container can connect over the compose network
      MYSQL_ROOT_HOST: "%"
    # Dev convenience only — bound to loopback, never reachable from other
    # machines. The production overlay removes the host port entirely.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Dev-only DB GUI. NOT started by plain `docker compose up`;
  # enable it with `--profile dev`.
  adminer:
    image: adminer
    container_name: jobsearch-adminer
    profiles: ["dev"]
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data: